name: tests
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU torch + project deps; fake gsplat comes from tests/)
        run: |
          # torch and torchvision must come from the same index: torchmetrics pulls torchvision, and a
          # PyPI torchvision next to a CPU-index torch fails with "operator torchvision::nms does not exist".
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q tests
